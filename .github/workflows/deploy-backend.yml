name: Deploy Backend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Get source code
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup Node
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # ==========================================
      # 3. Install dependencies
      # ==========================================

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # ==========================================
      # 4. Generate Prisma Client
      # ==========================================

      - name: Generate Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npx prisma generate

      # ==========================================
      # 5. Build backend
      # ==========================================

      - name: Build backend
        working-directory: backend
        run: npm run build

      # ==========================================
      # 6. Remove development dependencies
      # ==========================================

      - name: Remove development dependencies
        working-directory: backend
        run: |
          npm prune --omit=dev
          # prisma CLI is a devDependency; keep it so migrate deploy works on VPS
          npm install prisma --omit=dev --no-save

      # ==========================================
      # 7. Create deployment package
      # ==========================================

      - name: Create deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy/backend

          cp -r backend/dist deploy/backend/
          cp -r backend/node_modules deploy/backend/
          cp backend/package.json deploy/backend/
          cp backend/package-lock.json deploy/backend/

          if [ -d "backend/prisma" ]; then
            cp -r backend/prisma deploy/backend/
          fi

          if [ -d "backend/scripts" ]; then
            mkdir -p deploy/backend/scripts
            cp backend/scripts/*.cjs deploy/backend/scripts/ 2>/dev/null || true
            cp backend/scripts/*.sh deploy/backend/scripts/ 2>/dev/null || true
            cp backend/scripts/*.example deploy/backend/scripts/ 2>/dev/null || true
          fi

          echo "Deployment package:"
          du -sh deploy/backend
          ls -lah deploy/backend

      # ==========================================
      # 8. Test SSH connection
      # ==========================================

      - name: Test VPS SSH connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 30s
          script: |
            echo "======================================"
            echo "SSH connection successful!"
            echo "======================================"

            echo "Hostname:"
            hostname

            echo "User:"
            whoami

            echo "Server IP:"
            hostname -I

            echo "SSH test completed."

      # ==========================================
      # 9. Upload backend
      # ==========================================

      - name: Upload backend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "deploy/backend/*"
          target: "/tmp/cowadmin-deploy"
          strip_components: 2

      # ==========================================
      # 10. Deploy on VPS
      # ==========================================

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 180s

          script: |
            set -e

            echo "======================================"
            echo "Starting cowadmin backend deployment..."
            echo "======================================"

            APP_DIR="/var/www/cowadmin/backend"
            DEPLOY_DIR="/tmp/cowadmin-deploy"

            echo "Creating application directory..."
            mkdir -p "$APP_DIR"

            echo "Checking uploaded files..."

            if [ ! -d "$DEPLOY_DIR/dist" ]; then
              echo "ERROR: dist directory not found!"
              exit 1
            fi

            if [ ! -d "$DEPLOY_DIR/node_modules" ]; then
              echo "ERROR: node_modules directory not found!"
              exit 1
            fi

            echo "Upload verified."

            echo "Removing old application files..."

            rm -rf "$APP_DIR/dist"
            rm -rf "$APP_DIR/node_modules"

            echo "Installing new dist..."
            cp -r "$DEPLOY_DIR/dist" "$APP_DIR/"

            echo "Installing new node_modules..."
            cp -r "$DEPLOY_DIR/node_modules" "$APP_DIR/"

            echo "Installing package files..."

            cp "$DEPLOY_DIR/package.json" "$APP_DIR/"
            cp "$DEPLOY_DIR/package-lock.json" "$APP_DIR/"

            if [ -d "$DEPLOY_DIR/prisma" ]; then
              echo "Installing Prisma files..."

              rm -rf "$APP_DIR/prisma"
              cp -r "$DEPLOY_DIR/prisma" "$APP_DIR/"
            fi

            if [ -d "$DEPLOY_DIR/scripts" ]; then
              echo "Installing scripts..."
              mkdir -p "$APP_DIR/scripts"
              cp -r "$DEPLOY_DIR/scripts/." "$APP_DIR/scripts/"
            fi

            echo "Running Prisma migrations..."

            cd "$APP_DIR"

            npx prisma migrate deploy

            echo "Starting or restarting PM2..."

            if pm2 describe coadminapi > /dev/null 2>&1; then
              echo "coadminapi already exists — restarting..."
              pm2 restart coadminapi
            else
              echo "coadminapi not found — starting for the first time..."
              pm2 start dist/src/main.js --name coadminapi
            fi

            echo "Saving PM2 configuration..."

            pm2 save

            echo "Cleaning temporary deployment..."

            rm -rf "$DEPLOY_DIR"

            echo "======================================"
            echo "Deployment completed successfully!"
            echo "======================================"
